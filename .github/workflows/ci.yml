name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: crew_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/crew_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Syntax check
        run: node --check server.js
      - name: Build client
        run: npm run build
      - name: dist/ must match the source (it is committed and served as is)
        run: git diff --exit-code -- dist || (echo "dist/ is stale. Run npm run build and commit it." && exit 1)
      - name: API tests
        run: npm test
